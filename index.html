<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fifty5Blue UAT Portal</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#e4e7ec;--brand:#2457d6;--soft:#eef4ff;--ok:#157347;--bad:#b42318;--warn:#a15c00}*{box-sizing:border-box}body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}header{background:#111827;color:#fff;padding:24px 30px}header h1{margin:0;font-size:25px}header p{margin:5px 0 0;color:#cbd5e1}.layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 92px)}aside{background:#fff;border-right:1px solid var(--line);padding:20px;position:sticky;top:0;height:100vh;overflow:auto}main{padding:28px;max-width:1100px;width:100%}.navbtn{width:100%;text-align:left;border:0;background:transparent;padding:11px;border-radius:9px;margin:3px 0;cursor:pointer}.navbtn.active{background:var(--soft);color:var(--brand);font-weight:700}.progress{height:8px;background:#e5e7eb;border-radius:9px;overflow:hidden}.bar{height:100%;background:var(--brand);width:0}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 1px 2px #1018280d}.topgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric b{font-size:24px;display:block}.muted{color:var(--muted)}.trigger{background:var(--soft);padding:12px;border-radius:10px;margin:12px 0}.testhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.testid{font-size:12px;font-weight:800;color:var(--brand)}h2,h3{margin:.2em 0}.label{font-size:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:800;color:#475467;margin-top:14px}textarea,input{width:100%;border:1px solid #d0d5dd;border-radius:8px;padding:10px;font:inherit}textarea{min-height:72px}.statuses{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.status,.secondary{border:1px solid #d0d5dd;background:#fff;padding:8px 12px;border-radius:8px;cursor:pointer}.sel-pass{background:#ecfdf3!important;border-color:#6ce9a6!important;color:var(--ok)}.sel-fail{background:#fef3f2!important;border-color:#fda29b!important;color:var(--bad)}.sel-blocked{background:#fffaeb!important;border-color:#fec84b!important;color:var(--warn)}.dep{margin-top:12px;padding:10px;border-left:4px solid #f79009;background:#fffaeb}.session{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;justify-content:space-between;margin:18px 0}.sync{font-size:12px;margin-top:10px}.login{max-width:520px;margin:50px auto}.login input{margin:12px 0}.error{color:var(--bad)}footer{color:var(--muted);font-size:12px;margin:25px 0}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{position:relative;height:auto}.topgrid,.session{grid-template-columns:1fr 1fr}}@media print{aside,.actions{display:none}.layout{display:block}main{padding:0}.card{break-inside:avoid;box-shadow:none}}
</style></head><body><header><h1>Fifty5Blue — User Acceptance Testing</h1><p>Interactive client UAT portal · Workflows 1–7</p></header><div class="layout"><aside><h3>UAT Progress</h3><div class="progress"><div class="bar" id="allbar"></div></div><p class="muted" id="alltxt"></p><div id="nav"></div><hr><button class="secondary" onclick="window.print()">Print / Save PDF</button> <button class="secondary" onclick="logout()">Lock</button><div id="syncState" class="sync muted"></div></aside><main><div id="app"></div></main></div>
<script>window.workflows=[];</script><script src="w1.js"></script><script src="w2.js"></script><script src="w3.js"></script><script src="w4.js"></script><script src="w5.js"></script><script src="w6.js"></script><script src="w7.js"></script><script>
const workflows=window.workflows;let store={},current="1",timers=new Map(),accessKey=sessionStorage.getItem("f55blue_uat_access")||"";const API="https://xpdakbmfrrtcdhifoaug.supabase.co/functions/v1/uat-api";
const esc=s=>(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));const headers=()=>({"Content-Type":"application/json","x-uat-key":accessKey});
function sync(msg,err=false){let e=document.getElementById("syncState");if(e){e.textContent=msg;e.className="sync "+(err?"error":"muted")}}
function loginScreen(msg=""){document.getElementById("app").innerHTML=`<div class="card login"><div class="testid">FIFTY5BLUE UAT</div><h2>Enter UAT access code</h2><p class="muted">Use the shared access code provided by the implementation team. It is kept only for this browser session.</p>${msg?`<p class="error">${esc(msg)}</p>`:""}<input id="accessCode" type="password" placeholder="UAT access code" onkeydown="if(event.key==='Enter')login()"><button class="secondary" onclick="login()">Open UAT Portal</button></div>`}
async function login(){let e=document.getElementById("accessCode");accessKey=(e?.value||"").trim();if(!accessKey)return;sessionStorage.setItem("f55blue_uat_access",accessKey);await load()}function logout(){sessionStorage.removeItem("f55blue_uat_access");accessKey="";store={};loginScreen()}
async function load(){if(!accessKey){loginScreen();return}try{let r=await fetch(API,{headers:headers()});if(r.status===401){logout();loginScreen("That access code was not accepted.");return}if(!r.ok)throw Error("Unable to load shared UAT data");let d=await r.json();store={};(d.results||[]).forEach(x=>store[x.test_id]={status:x.status||"",actual:x.actual_outcome||"",notes:x.notes||""});(d.sessions||[]).forEach(x=>{store["tester"+x.workflow_number]=x.tester||"";store["date"+x.workflow_number]=x.test_date||""});render();sync("Shared data loaded")}catch(e){document.getElementById("app").innerHTML=`<div class="card"><h2>Unable to load UAT portal</h2><p>${esc(e.message)}</p><button class="secondary" onclick="load()">Retry</button></div>`}}
function rec(id){return store[id]||(store[id]={status:"",actual:"",notes:""})}function post(b){let k=b.type+":"+(b.test_id||b.workflow_number);if(timers.has(k))clearTimeout(timers.get(k));sync("Saving…");timers.set(k,setTimeout(async()=>{try{let r=await fetch(API,{method:"POST",headers:headers(),body:JSON.stringify(b)});if(r.status===401){logout();return}if(!r.ok)throw Error();sync("Saved to shared UAT")}catch{sync("Save error — retry your last change",true)}finally{timers.delete(k)}},350))}
function setField(id,k,v){rec(id)[k]=v;let w=+id.match(/^W(\d+)-/)[1];post({type:"result",test_id:id,workflow_number:w,status:rec(id).status,actual_outcome:rec(id).actual,notes:rec(id).notes,tester:store["tester"+w]||"",test_date:store["date"+w]||null});nav();metrics()}function setSession(w,k,v){store[k+w]=v;post({type:"session",workflow_number:+w,tester:store["tester"+w]||"",test_date:store["date"+w]||null})}
function nav(){document.getElementById("nav").innerHTML=workflows.map(w=>`<button class="navbtn ${w.n===current?"active":""}" onclick="current='${w.n}';render()">Workflow ${w.n}<br><span class="muted">${w.tests.filter(t=>rec(t.id).status).length}/${w.tests.length} · ${esc(w.name)}</span></button>`).join("")}
function metrics(){let t=workflows.flatMap(w=>w.tests),done=t.filter(x=>rec(x.id).status).length,m={pass:t.filter(x=>rec(x.id).status==="Pass").length,fail:t.filter(x=>rec(x.id).status==="Fail").length,block:t.filter(x=>rec(x.id).status==="Blocked").length};m.pct=Math.round(done/t.length*100);document.getElementById("allbar").style.width=m.pct+"%";document.getElementById("alltxt").textContent=`${m.pct}% complete · ${done}/${t.length} tested`;return m}
function sb(id,s){return `<button class="status ${rec(id).status===s?"sel-"+s.toLowerCase():""}" onclick="setField('${id}','status','${s}');render()">${s}</button>`}
function render(){let w=workflows.find(x=>x.n===current),m=metrics(),h=`<div class="topgrid"><div class="card metric"><span class="muted">Overall</span><b>${m.pct}%</b></div><div class="card metric"><span class="muted">Passed</span><b>${m.pass}</b></div><div class="card metric"><span class="muted">Failed</span><b>${m.fail}</b></div><div class="card metric"><span class="muted">Blocked</span><b>${m.block}</b></div></div><div class="card"><div class="testid">WORKFLOW ${w.n}</div><h2>${esc(w.name)}</h2><div class="trigger"><b>Trigger:</b> ${esc(w.trigger)}</div><div class="session"><label>Tester<input value="${esc(store["tester"+w.n]||"")}" oninput="setSession('${w.n}','tester',this.value)"></label><label>Test date<input type="date" value="${esc(store["date"+w.n]||"")}" oninput="setSession('${w.n}','date',this.value)"></label></div></div>`;w.tests.forEach(t=>{let r=rec(t.id);h+=`<div class="card"><div class="testhead"><div><div class="testid">${t.id}</div><h3>${esc(t.title)}</h3></div><div>${r.status?`<b>${r.status}</b>`:"<span class='muted'>Not tested</span>"}</div></div><div class="label">Step in Process</div><div>${esc(t.step)}</div><div class="label">Expected Outcome</div><div>${esc(t.expected)}</div>${t.dependency?`<div class="dep"><b>Dependency / validation note:</b> ${esc(t.dependency)}</div>`:""}<div class="label">Actual Outcome</div><textarea oninput="setField('${t.id}','actual',this.value)">${esc(r.actual)}</textarea><div class="label">Result</div><div class="statuses">${sb(t.id,"Pass")}${sb(t.id,"Fail")}${sb(t.id,"Blocked")}<button class="status" onclick="setField('${t.id}','status','');render()">Clear</button></div><div class="label">Tester Notes / Evidence</div><textarea oninput="setField('${t.id}','notes',this.value)">${esc(r.notes)}</textarea></div>`});h+=`<div class="actions"><button class="secondary" onclick="move(-1)">← Previous workflow</button><button class="secondary" onclick="move(1)">Next workflow →</button></div><footer>Shared Fifty5Blue UAT portal. Results are saved centrally and visible to all testers using this portal.</footer>`;document.getElementById("app").innerHTML=h;nav()}function move(d){let i=workflows.findIndex(x=>x.n===current);current=workflows[Math.max(0,Math.min(workflows.length-1,i+d))].n;render()}load();
</script></body></html>
